<!doctype html>
<html lang="en">

<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Edit Event</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            padding: 2rem;
            background: #f7f7f8;
        }

        .card {
            background: #fff;
            padding: 1.25rem;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            max-width: 520px;
            margin: 0 auto
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.35rem
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        button {
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #0069ff;
            color: #fff;
            font-weight: 600
        }
    </style>
</head>

<body>
    <main class="card">
        <h1 style="margin-top:0">Edit Event</h1>

        <form id="eventForm">
            <div>
                <label for="Url">URL</label>
                <input id="Url" type="text" />
            </div>

            <div>
                <label for="Name">Name (no spaces or special chars)</label>
                <input id="Name" type="text" />
            </div>

            <div>
                <label for="Country">Country</label>
                <input id="Country" type="text" />
            </div>

            <div>
                <label for="CountryIso2">Country ISO2</label>
                <input id="CountryIso2" type="text" />
            </div>

            <div>
                <label for="City">City</label>
                <input id="City" type="text" />
            </div>

            <div>
                <label for="Longitude">Longitude (20.123)</label>
                <input id="Longitude" type="number" step="any" />
            </div>

            <div>
                <label for="Latitude">Latitude (41.123)</label>
                <input id="Latitude" type="number" step="any" />
            </div>

            <div>
                <label for="Type">Type (generic one is 'Events', others: Club, Bar)</label>
                <input id="Type" type="text" />
            </div>

            <button type="submit">Submit</button>
        </form>
    </main>

    <script>
        const form = document.getElementById('eventForm');

        const fieldIds = [
            "Url",        // 0
            "Name",       // 1
            "Country",    // 2
            "CountryIso2",// 3
            "City",       // 4
            "Longitude",  // 5
            "Latitude",   // 6
            "Type"        // 8
        ];

        // Fill inputs from URL
        fieldIds.forEach(id => {
            const el = document.getElementById(id);
            const val = getDataFromUrl(id);
            if (val) el.value = decodeURIComponent(val);
        });

        form.addEventListener('submit', e => {
            e.preventDefault();

            const data = {};
            fieldIds.forEach(id => {
                data[id] = document.getElementById(id).value;
            });

            // IMPORTANT: keep index alignment with your split[]
            const combined = [
                data.Url || "",        // 0
                data.Name || "",       // 1
                data.Country || "",    // 2
                data.CountryIso2 || "",// 3
                data.City || "",       // 4
                data.Longitude || "",  // 5
                data.Latitude || "",   // 6
                data.Type || ""        // 7
            ].join(" $$$$ ");

            sendToTelegram("anics " + combined);
        });

        function getDataFromUrl(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        function sendToTelegram(data) {
            try {
                console.log(data);

                window.Telegram.WebApp.sendData(data);
                window.Telegram.WebApp.close();
            } catch (error) {
                alert(error);
            }
        }
    </script>
</body>

</html>
